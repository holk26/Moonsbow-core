######################################################################
# LOCAL DEVELOPMENT ONLY
#
# This file is provided for running the full stack on your laptop.
# For production use Dokploy: deploy the image built from the single
# Dockerfile and connect it to external PostgreSQL and Redis services
# via a shared Docker network.  See DEPLOYMENT.md for details.
######################################################################
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    environment:
      APP_MODE: api
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://moonsbow:moonsbow@postgres:5432/moonsbow
      ATLAS_DATABASE_URL: postgresql://moonsbow:moonsbow@postgres:5432/moonsbow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - moonsbow_net
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_MODE: worker
      DATABASE_URL: postgresql+asyncpg://moonsbow:moonsbow@postgres:5432/moonsbow
      ATLAS_DATABASE_URL: postgresql://moonsbow:moonsbow@postgres:5432/moonsbow
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - moonsbow_net
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: moonsbow
      POSTGRES_PASSWORD: moonsbow
      POSTGRES_DB: moonsbow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moonsbow"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonsbow_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - moonsbow_net

volumes:
  postgres_data:
  redis_data:

networks:
  moonsbow_net:
    driver: bridge
